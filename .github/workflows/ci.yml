name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github citerx tests app
      - name: Unit tests
        run: pytest -q
      - name: Evaluation quality gate
        # Deterministic extractive mode: no LLM or model downloads, runs in seconds.
        # Fails the build if any metric drops below its threshold.
        run: python -m citerx.eval.run --out eval-report.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: eval-report.json
